name: Validate SSR guide issue 269 v2

on:
  push:
    branches:
      - automation/validate-ssr-guide-269-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: docs/ssr-guide-269
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test --coverage --runInBand
      - run: yarn build
      - run: yarn build-storybook

      - name: Verify SSR guide integration
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/server-side-rendering.md
          grep -Fq '[server-side rendering guide](docs/server-side-rendering.md)' README.md
          ! grep -Fq '[server-side rendering guide](/docs/server-side-rendering.md)' README.md
          grep -Fq '<Meta title="Guides/Server-side rendering" />' src/server-side-rendering.stories.mdx
          grep -Fq "import('nhsuk-frontend')" src/components/form-elements/button/Button.tsx
          grep -Fq "'use client';" src/components/form-elements/button/Button.tsx
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
