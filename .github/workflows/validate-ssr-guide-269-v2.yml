name: Validate SSR guide issue 269 v2

on:
  push:
    branches:
      - automation/validate-ssr-guide-269-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 66fc09d80622afea0202c5ba75e77ae85e496355
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify audited commit
        run: test "$(git rev-parse HEAD)" = "66fc09d80622afea0202c5ba75e77ae85e496355"

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn test --coverage --runInBand
      - run: yarn build
      - run: yarn build-storybook

      - name: Verify SSR guide integration
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          story = Path("stories/Guides/ServerSideRendering.mdx").read_text(encoding="utf-8")
          button = Path("src/components/form-elements/button/Button.tsx").read_text(encoding="utf-8")

          assert Path("docs/server-side-rendering.md").is_file()
          assert "[server-side rendering guide](docs/server-side-rendering.md)" in readme
          assert "[server-side rendering guide](/docs/server-side-rendering.md)" not in readme
          assert '<Meta title="Guides/Server-side rendering" />' in story
          assert "import('nhsuk-frontend')" in button
          assert "'use client';" in button
          PY
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
